[package]
name = "mylore"
version = "0.1.0"
description = "myLore Desktop PKM & Lifelog Platform"
authors = ["iseohyun"]
edition = "2021"

[lib]
name = "mylore_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
regex = "1"
chrono = "0.4"
tiny_http = "0.12"
